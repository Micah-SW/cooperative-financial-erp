[project]
name = "coop-erp-backend"
version = "0.1.0"
description = "Cooperative Financial Management ERP — Backend"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
    "Depends",
    "Query",
    "Path",
    "Body",
    "Header",
    "Security",
    "require_role",
    "app.core.dependencies.require_role",
]

[tool.ruff.lint.per-file-ignores]
# Intentional pass statements in future business-service skeletons deferred to subsequent chapters
"app/services/contribution_service.py" = ["PIE790"]
"app/services/expense_service.py" = ["PIE790"]
"app/services/fund_service.py" = ["PIE790"]
"app/services/member_service.py" = ["PIE790"]
"app/services/project_service.py" = ["PIE790"]
"app/services/property_service.py" = ["PIE790"]
"app/services/report_service.py" = ["PIE790"]
"app/services/transaction_service.py" = ["PIE790"]
"app/services/withdrawal_service.py" = ["PIE790"]
